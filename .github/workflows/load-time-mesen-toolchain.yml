name: Load-time Mesen 2.2.1 toolchain

on:
  push:
    branches:
      - perf/load-time-investigation-20260911
    paths:
      - .github/workflows/load-time-mesen-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-mesen:
    name: Fetch exact Mesen 2.2.1 toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Download official Mesen 2.2.1 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output Mesen_2.2.1_Linux_x64.zip \
            https://github.com/nesdev-org/MesenCE/releases/download/2.2.1/Mesen_2.2.1_Linux_x64.zip

      - name: Verify published SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "c88ff4d251b407515c43d3332d641927655cd69fb538996b6a21da4509dbb58f  Mesen_2.2.1_Linux_x64.zip" | sha256sum --check --strict
          unzip -l Mesen_2.2.1_Linux_x64.zip

      - name: Download exact 2.2.1 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output MesenCE-20ba206.tar.gz \
            https://github.com/nesdev-org/MesenCE/archive/20ba206cef5ba207c21203176d02cb9f43dda9fb.tar.gz
          mkdir source
          tar -xzf MesenCE-20ba206.tar.gz -C source --strip-components=1
          test "$(git ls-remote https://github.com/nesdev-org/MesenCE.git refs/tags/2.2.1^{} | cut -f1)" = "20ba206cef5ba207c21203176d02cb9f43dda9fb"

      - name: Retain exact emulator and source
        uses: actions/upload-artifact@v4
        with:
          name: mesen-2.2.1-toolchain
          path: |
            Mesen_2.2.1_Linux_x64.zip
            MesenCE-20ba206.tar.gz
          if-no-files-found: error
          retention-days: 7
