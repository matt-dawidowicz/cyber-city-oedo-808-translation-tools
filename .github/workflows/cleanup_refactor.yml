name: One-time cleanup polish

on:
  push:
    branches:
      - cleanup/modern-architecture-20260909

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/modern-architecture-20260909

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format maintained Python surface
        run: python -m ruff format cyber_oedo tests

      - name: Validate formatted package
        run: |
          python -m ruff check cyber_oedo tests
          python -m unittest discover -s tests -v
          python -m compileall -q cyber_oedo tests
          python -m cyber_oedo --help
          python -m cyber_oedo doctor
          python -m build --outdir dist

      - name: Commit only after checks pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyber_oedo tests
          git commit -m "Style: format decomposed package and tests"
          git push origin HEAD:cleanup/modern-architecture-20260909
