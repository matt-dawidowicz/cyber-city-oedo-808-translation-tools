name: One-time cleanup refactor

on:
  push:
    branches:
      - cleanup/modern-architecture-20260909

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v7
        with:
          ref: cleanup/modern-architecture-20260909

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply mechanical package refactor
        run: |
          python tools/refactor_cleanup.py
          python - <<'PY'
          from pathlib import Path

          path = Path("cyber_oedo/text/relocation.py")
          text = path.read_text(encoding="utf-8")
          needle = "from cyber_oedo.disc.cdrom_mode1 import PayloadPatch\n"
          replacement = (
              needle
              + "from cyber_oedo.text.layout import (\n"
              + "    DIALOGUE_MARKER,\n"
              + "    DIALOGUE_TERMINATOR,\n"
              + ")\n"
          )
          if needle not in text:
              raise SystemExit("generated relocation import anchor missing")
          path.write_text(
              text.replace(needle, replacement, 1),
              encoding="utf-8",
          )
          PY

      - name: Reinstall refactored package
        run: python -m pip install -e ".[dev]"

      - name: Check refactored package
        run: |
          python -m ruff check cyber_oedo tests
          python -m unittest discover -s tests -v
          python -m compileall -q cyber_oedo tests
          python -m cyber_oedo --help
          python -m cyber_oedo doctor

      - name: Commit only after checks pass
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cleanup: split build profile and remove root shims"
          git push origin HEAD:cleanup/modern-architecture-20260909
