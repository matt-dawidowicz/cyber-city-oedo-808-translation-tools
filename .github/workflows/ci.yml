name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Smoke-test unified command
        run: python -m cyber_oedo --help

      - name: Check installed environment
        run: python -m cyber_oedo doctor

      - name: Build wheel
        run: python -m build --wheel --outdir dist
