name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    if: github.event_name != 'workflow_dispatch'
    name: Ubuntu slim / Python 3.13
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Smoke-test editable command
        run: python -m cyber_oedo --help

      - name: Check editable environment
        run: python -m cyber_oedo doctor

      - name: Build source and wheel distributions
        run: python -m build --outdir dist

      - name: Smoke-test installed wheel outside checkout
        run: >-
          python -c "import glob, subprocess, sys, tempfile;
          wheel=glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', wheel]);
          subprocess.check_call([sys.executable, '-m', 'cyber_oedo', '--help'],
          cwd=tempfile.gettempdir());
          subprocess.check_call([sys.executable, '-m', 'cyber_oedo', 'doctor'],
          cwd=tempfile.gettempdir())"

  compatibility-matrix:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Run synthetic regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Smoke-test editable command
        run: python -m cyber_oedo --help

      - name: Check editable environment
        run: python -m cyber_oedo doctor

      - name: Build source and wheel distributions
        run: python -m build --outdir dist

      - name: Smoke-test installed wheel outside checkout
        run: >-
          python -c "import glob, subprocess, sys, tempfile;
          wheel=glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', '--no-deps', wheel]);
          subprocess.check_call([sys.executable, '-m', 'cyber_oedo', '--help'],
          cwd=tempfile.gettempdir());
          subprocess.check_call([sys.executable, '-m', 'cyber_oedo', 'doctor'],
          cwd=tempfile.gettempdir())"
