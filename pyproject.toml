[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-city-oedo-808-translation-tools"
version = "0.1.0"
description = "Reverse-engineering and text-analysis tools for Cyber City Oedo 808"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Dawidowicz" },
]
keywords = [
    "pc-engine",
    "romhacking",
    "translation",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
graphics = [
    "Pillow>=10",
]
dev = [
    "Pillow>=10",
    "build>=1.2",
]

[project.scripts]
cyber-oedo = "cyber_oedo.cli:console_main"

[project.urls]
Repository = "https://github.com/matt-dawidowicz/cyber-city-oedo-808-translation-tools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cyber_oedo*"]
